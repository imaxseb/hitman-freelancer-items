<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Items</title>
    <link rel="icon" href="favicon.jpg">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="toggle-all-filters.js"></script>
    <script type="text/javascript" src="toggle-filters.js"></script>
    <script type="text/javascript" src="clear-filters.js"></script>
    <script type="text/javascript" src="select-objective.js"></script>
    <script type="text/javascript" src="filter-table.js"></script>
    <script type="text/javascript" src="search-table.js"></script>
    <script type="text/javascript" src="sort-table.js"></script>
    <script type="text/javascript" src="responsive-items.js"></script>
    <script type="text/javascript" src="load-items.js"></script>
</head>

<body>
    <div class="container">
        <div class="sticky-toolbar">
            <h1>HITMAN Freelancer Items</h1>
            <div class="options-row">
                <button class="filter-toggle" onclick="toggleFilters()">Show/Hide Filters</button>
                <button class="filter-toggle" onclick="clearFilters()">Clear All Filters</button>
                <input type="text" id="myInput" class="search-input" onkeyup="searchItems()" placeholder="Search for item"
                    title="Type in a name">
                <select class="objectives" onchange="selectObjective(this.value)">
                <option>Select an objective. (*) items in map can be used.</option>
                <optgroup label="Prestige Objective">
                    <option value="are">Assualt Rifle Kill - Epic</option>
                    <option value="cke">Collateral Kill - Explosive (*)</option>
                    <option value="ckf">Collateral Kill - Firearms</option>
                    <option value="hkl">Headshot Kill - Legendary</option>
                    <option value="ik">Icepick Kill</option>
                    <option value="kak">Katana Kill</option>
                    <option value="mke">Melee Kill - Epic</option>
                    <option value="ose">Open Safe - Explosive (*)</option>
                    <option value="suk">Shuriken Kill</option>
                    <option value="upk">Unsilenced Pistol Kill - Epic</option>
                </optgroup>
                <optgroup label="Payout Objectives">
                    <option value="ar">Assault Rifle Kill</option>
                    <option value="axe">Axe Kill</option>
                    <option value="bg">Blind Guard</option>
                    <option value="bt">Blind Target</option>
                    <option value="dt">Deadly Throw (*)</option>
                    <option value="ek">Electrocution Kill (*)</option>
                    <option value="egar">Eliminate Guards - Assault Rifle</option>
                    <option value="egsh">Eliminate Guards - Shotgun</option>
                    <option value="egsn">Eliminate Guards - Sniper</option>
                    <option value="exk">Explosive Kill (*)</option>
                    <option value="exfg">Explosive Kill - Fragmentation Grenade</option>
                    <option value="exp">Explosive Kill - Proximity</option>
                    <option value="exr">Explosive Kill - Remote</option>
                    <option value="fw">Fiberwire Kill</option>
                    <option value="kk">Knife Kill (*)</option>
                    <option value="pgc">Pacify Guards - Concussive Explosives</option>
                    <option value="pgs">Poison Guard - Syringe</option>
                    <option value="pk">Poison Kill</option>
                    <option value="ptdg">Poison Target - Dart Gun</option>
                    <option value="pte">Poison Target - Emetic (*)</option>
                    <option value="pts">Poison Target - Sedative</option>
                    <option value="sk">Shotgun Kill</option>
                    <option value="sifk">Silenced Firearm Kill</option>
                    <option value="sipk">Silenced Pistol Kill</option>
                    <option value="sisk">Silenced Sniper Kill</option>
                    <option value="stt">Silenced Target Takedown - Rare Melee</option>
                    <option value="snk">Sniper Rifle Kill</option>
                    <option value="smgk">Sub Machine Gun Kill</option>
                    <option value="tk">Trap Kill - Oil/Water Canister</option>
                </optgroup>
                </select>
            </div>
        </div>

        <div class="filters" id="filtersDiv">
            <div class="filter-group">
                <div class="checkbox-group">
                    <button class="filter-title" data-filter="section-title" data-value="SectionTitle"
                        onclick="toggleAllFilters('section')">Section</button>
                    <button class="filter-button" data-filter="section" data-value="Assault Rifles"
                        onclick="toggleFilter(this)">Assault Rifles</button>
                    <button class="filter-button" data-filter="section" data-value="Freelancer Tools (Explosives)"
                        onclick="toggleFilter(this)">Freelancer Tools (Explosives)</button>
                    <button class="filter-button" data-filter="section" data-value="Freelancer Tools (Poisons)"
                        onclick="toggleFilter(this)">Freelancer Tools (Poisons)</button>
                    <button class="filter-button" data-filter="section" data-value="Freelancer Tools (Tools)"
                        onclick="toggleFilter(this)">Freelancer Tools (Tools)</button>
                    <button class="filter-button" data-filter="section" data-value="Melee Weapons"
                        onclick="toggleFilter(this)">Melee Weapons</button>
                    <button class="filter-button" data-filter="section" data-value="Pistols"
                        onclick="toggleFilter(this)">Pistols</button>
                    <button class="filter-button" data-filter="section" data-value="Shotguns"
                        onclick="toggleFilter(this)">Shotguns</button>
                    <button class="filter-button" data-filter="section" data-value="SMGs"
                        onclick="toggleFilter(this)">SMGs</button>
                    <button class="filter-button" data-filter="section" data-value="Sniper Rifles"
                        onclick="toggleFilter(this)">Sniper Rifles</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Ancestral)"
                        onclick="toggleFilter(this)">Thematic Weapons (Ancestral)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Banker)"
                        onclick="toggleFilter(this)">Thematic Weapons (Banker)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Champions)"
                        onclick="toggleFilter(this)">Thematic Weapons (Champions)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Disruptor)"
                        onclick="toggleFilter(this)">Thematic Weapons (Disruptor)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Drop)"
                        onclick="toggleFilter(this)">Thematic Weapons (Drop)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Getaway)"
                        onclick="toggleFilter(this)">Thematic Weapons (Getaway)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Herbalist)"
                        onclick="toggleFilter(this)">Thematic Weapons (Herbalist)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Infiltrator)"
                        onclick="toggleFilter(this)">Thematic Weapons (Infiltrator)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Makeshift)"
                        onclick="toggleFilter(this)">Thematic Weapons (Makeshift)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Ornamental)"
                        onclick="toggleFilter(this)">Thematic Weapons (Ornamental)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Reflection)"
                        onclick="toggleFilter(this)">Thematic Weapons (Reflection)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Requiem)"
                        onclick="toggleFilter(this)">Thematic Weapons (Requiem)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Splitter)"
                        onclick="toggleFilter(this)">Thematic Weapons (Splitter)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Street Art)"
                        onclick="toggleFilter(this)">Thematic Weapons (Street Art)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Trinity)"
                        onclick="toggleFilter(this)">Thematic Weapons (Trinity)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Undying)"
                        onclick="toggleFilter(this)">Thematic Weapons (Undying)</button>
                    <button class="filter-button" data-filter="section" data-value="Thematic Weapons (Wizard)"
                        onclick="toggleFilter(this)">Thematic Weapons (Wizard)</button>

                </div>
            </div>
            <div>
                <div class="filter-group">
                    <div class="checkbox-group">
                        <button class="filter-title" data-filter="type-title" data-value="TypeTitle"
                            onclick="toggleAllFilters('type')">Type</button>
                        <button class="filter-button" data-filter="type" data-value="Assault Rifle"
                            onclick="toggleFilter(this)">Assault Rifle</button>
                        <button class="filter-button" data-filter="type" data-value="Dart Gun"
                            onclick="toggleFilter(this)">Dart Gun</button>
                        <button class="filter-button" data-filter="type" data-value="Grenade"
                            onclick="toggleFilter(this)">Grenade</button>
                        <button class="filter-button" data-filter="type" data-value="Impact"
                            onclick="toggleFilter(this)">Impact</button>
                        <button class="filter-button" data-filter="type" data-value="Melee"
                            onclick="toggleFilter(this)">Melee</button>
                        <button class="filter-button" data-filter="type" data-value="Pistol"
                            onclick="toggleFilter(this)">Pistol</button>
                        <button class="filter-button" data-filter="type" data-value="Poison"
                            onclick="toggleFilter(this)">Poison</button>
                        <button class="filter-button" data-filter="type" data-value="Proximity"
                            onclick="toggleFilter(this)">Proximity</button>
                        <button class="filter-button" data-filter="type" data-value="Remote"
                            onclick="toggleFilter(this)">Remote</button>
                        <button class="filter-button" data-filter="type" data-value="Shotgun"
                            onclick="toggleFilter(this)">Shotgun</button>
                        <button class="filter-button" data-filter="type" data-value="SMG"
                            onclick="toggleFilter(this)">SMG</button>
                        <button class="filter-button" data-filter="type" data-value="Sniper Rifle"
                            onclick="toggleFilter(this)">Sniper Rifle</button>
                        <button class="filter-button" data-filter="type" data-value="Tool"
                            onclick="toggleFilter(this)">Tool</button>

                    </div>
                </div>
            </div>
            <div class="filter-group">
                <div class="checkbox-group">
                    <button class="filter-title" data-filter="subtype-title" data-value="SubTypeTitle"
                        onclick="toggleAllFilters('subtype')">Sub-Type</button>
                    <button class="filter-button" data-filter="subtype" data-value="Axe"
                        onclick="toggleFilter(this)">Axe</button>
                    <button class="filter-button" data-filter="subtype" data-value="Baseball Bat"
                        onclick="toggleFilter(this)">Baseball Bat</button>
                    <button class="filter-button" data-filter="subtype" data-value="Concussion"
                        onclick="toggleFilter(this)">Concussion</button>
                    <button class="filter-button" data-filter="subtype" data-value="Crowbar"
                        onclick="toggleFilter(this)">Crowbar</button>
                    <button class="filter-button" data-filter="subtype" data-value="Distraction"
                        onclick="toggleFilter(this)">Distraction</button>
                    <button class="filter-button" data-filter="subtype" data-value="Emetic"
                        onclick="toggleFilter(this)">Emetic</button>
                    <button class="filter-button" data-filter="subtype" data-value="EMP"
                        onclick="toggleFilter(this)">EMP</button>
                    <button class="filter-button" data-filter="subtype" data-value="Explosive"
                        onclick="toggleFilter(this)">Explosive</button>
                    <button class="filter-button" data-filter="subtype" data-value="Fiber Wire"
                        onclick="toggleFilter(this)">Fiber Wire</button>
                    <button class="filter-button" data-filter="subtype" data-value="Flash"
                        onclick="toggleFilter(this)">Flash</button>
                    <button class="filter-button" data-filter="subtype" data-value="Fragmentation"
                        onclick="toggleFilter(this)">Fragmentation</button>
                    <button class="filter-button" data-filter="subtype" data-value="Ice Pick"
                        onclick="toggleFilter(this)">Ice Pick</button>
                    <button class="filter-button" data-filter="subtype" data-value="Katana"
                        onclick="toggleFilter(this)">Katana</button>
                    <button class="filter-button" data-filter="subtype" data-value="Key Hacker"
                        onclick="toggleFilter(this)">Key Hacker</button>
                    <button class="filter-button" data-filter="subtype" data-value="Knife"
                        onclick="toggleFilter(this)">Knife</button>
                    <button class="filter-button" data-filter="subtype" data-value="Lethal"
                        onclick="toggleFilter(this)">Lethal</button>
                    <button class="filter-button" data-filter="subtype" data-value="Lockpick"
                        onclick="toggleFilter(this)">Lockpick</button>
                    <button class="filter-button" data-filter="subtype" data-value="Non-Lethal"
                        onclick="toggleFilter(this)">Non-Lethal</button>
                    <button class="filter-button" data-filter="subtype" data-value="Sedative"
                        onclick="toggleFilter(this)">Sedative</button>
                    <button class="filter-button" data-filter="subtype" data-value="Shuriken"
                        onclick="toggleFilter(this)">Shuriken</button>
                    <button class="filter-button" data-filter="subtype" data-value="Syringe"
                        onclick="toggleFilter(this)">Syringe</button>
                    <button class="filter-button" data-filter="subtype" data-value="Taser"
                        onclick="toggleFilter(this)">Taser</button>
                    <button class="filter-button" data-filter="subtype" data-value="Trap"
                        onclick="toggleFilter(this)">Trap</button>
                </div>
            </div>

            <div class="filter-group">
                <div class="checkbox-group">
                    <button class="filter-title" data-filter="silenced-title" data-value="SilencedTitle"
                        onclick="toggleAllFilters('silenced')">Silenced</button>
                    <button class="filter-button" data-filter="silenced" data-value="Silenced"
                        onclick="toggleFilter(this)">Silenced</button>
                    <button class="filter-button" data-filter="silenced" data-value="Unsilenced"
                        onclick="toggleFilter(this)">Unsilenced</button>
                </div>
            </div>

            <div class="filter-group">
                <div class="checkbox-group">
                    <button class="filter-title" data-filter="piercing-title" data-value="PiercingTitle"
                        onclick="toggleAllFilters('piercing')">Piercing</button>
                    <button class="filter-button" data-filter="piercing" data-value="Piercing"
                        onclick="toggleFilter(this)">Piercing</button>
                    <button class="filter-button" data-filter="piercing" data-value="Non-Piercing"
                        onclick="toggleFilter(this)">Non-Piercing</button>
                </div>
            </div>

            <div class="filter-group">
                <div class="checkbox-group">
                    <button class="filter-title" data-filter="conceal-title" data-value="ConsealableTitle"
                        onclick="toggleAllFilters('conceal')">Consealable</button>
                    <button class="filter-button" data-filter="conceal" data-value="Yes"
                        onclick="toggleFilter(this)">Yes</button>
                    <button class="filter-button" data-filter="conceal" data-value="No"
                        onclick="toggleFilter(this)">No</button>
                </div>
            </div>

            <div class="filter-group">
                <div class="checkbox-group">
                    <button class="filter-title" data-filter="prestige-title" data-value="PrestigeTitle"
                        onclick="toggleAllFilters('prestige')">Prestige</button>
                    <button class="filter-button" data-filter="prestige" data-value="Yes"
                        onclick="toggleFilter(this)">Yes</button>
                    <button class="filter-button" data-filter="prestige" data-value="No"
                        onclick="toggleFilter(this)">No</button>
                </div>
            </div>

            <div class="filter-group">
                <div class="checkbox-group">
                    <button class="filter-title" data-filter="rarity-title" data-value="RarityTitle"
                        onclick="toggleAllFilters('rarity')">Rarity</button>
                    <button class="filter-button" data-filter="rarity" data-value="Common"
                        onclick="toggleFilter(this)">Common</button>
                    <button class="filter-button" data-filter="rarity" data-value="Rare"
                        onclick="toggleFilter(this)">Rare</button>
                    <button class="filter-button" data-filter="rarity" data-value="Epic"
                        onclick="toggleFilter(this)">Epic</button>
                    <button class="filter-button" data-filter="rarity" data-value="Legendary"
                        onclick="toggleFilter(this)">Legendary</button>
                </div>
            </div>

            <div class="filter-group">
                <div class="checkbox-group">
                    <button class="filter-title" data-filter="capacity-title" data-value="CapacityTitle"
                        onclick="toggleAllFilters('capacity')">Capacity</button>
                    <button class="filter-button" data-filter="capacity" data-value="1"
                        onclick="toggleFilter(this)">1</button>
                    <button class="filter-button" data-filter="capacity" data-value="2"
                        onclick="toggleFilter(this)">2</button>
                    <button class="filter-button" data-filter="capacity" data-value="3"
                        onclick="toggleFilter(this)">3</button>
                    <button class="filter-button" data-filter="capacity" data-value="4"
                        onclick="toggleFilter(this)">4</button>
                    <button class="filter-button" data-filter="capacity" data-value="5"
                        onclick="toggleFilter(this)">5</button>
                </div>
            </div>
        </div>

        <div class="mobile-sort">
            <label for="mobileSort">Sort items by</label>
            <div class="mobile-sort-controls">
                <select id="mobileSort" onchange="sortItemsMobile()">
                    <option value="0">Item</option>
                    <option value="1">Section</option>
                    <option value="2">Type</option>
                    <option value="3">Sub-Type</option>
                    <option value="4">Concealable</option>
                    <option value="5">Prestige</option>
                    <option value="6">Rarity</option>
                    <option value="7">Capacity</option>
                    <option value="8">Price</option>
                </select>
                <button id="mobileSortDirectionToggle" type="button" onclick="toggleSortDirection()">Ascending</button>
            </div>
        </div>

        <table id="dataTable">
            <thead>
                <tr>
                    <th class="sortable" onclick="sortTable(0)">Item</th>
                    <th class="sortable" onclick="sortTable(1)">Section</th>
                    <th class="sortable" onclick="sortTable(2)">Type</th>
                    <th class="sortable" onclick="sortTable(3)">Sub-Type</th>
                    <th class="sortable" onclick="sortTable(4)">Consealable</th>
                    <th class="sortable" onclick="sortTable(5)">Prestige</th>
                    <th class="sortable" onclick="sortTable(6)">Rarity</th>
                    <th class="sortable" onclick="sortTable(7)">Capacity</th>
                    <th class="sortable" onclick="sortTable(8)">Price</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div id="cardGrid" class="card-grid" aria-live="polite"></div>

        <div id="noResults" class="no-results hidden">
            No entries match the selected filters.
        </div>

    </div>


</body>

</html>
